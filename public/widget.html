<!DOCTYPE html>
<html>
<head>
  <title>Budget Tracker Widget</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
    }
    .widget-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .widget-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .widget-data {
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="widget-title">Budget Tracker</div>
    <div class="widget-data">
      <p>Loading...</p>
    </div>
  </div>
  <script>
    async function updateWidget() {
      const response = await fetch("/api/widget-data");
      const data = await response.json();
      const widgetData = document.querySelector(".widget-data");
      widgetData.innerHTML = `<p>Income: ${data.income}</p><p>Expenses: ${data.expenses}</p>`;
    }
    updateWidget();
  </script>
</body>
</html>
